name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          java-package: jdk
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;33.0.1" "ndk;25.2.9519653"

      - name: Generate temporary signing key
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -v \
            -keystore keystore/debug.jks \
            -storepass android \
            -keypass android \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SmsForwarder Debug,O=Local,C=CN"
          cat > keystore/keystore.properties <<'EOF'
          storeFile=../keystore/debug.jks
          storePassword=android
          keyAlias=debug
          keyPassword=android
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug -PisNeedPackage=false -PisNeedClean=false --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-debug-apk
          path: build/app/outputs/apk/debug/*.apk
          if-no-files-found: error
